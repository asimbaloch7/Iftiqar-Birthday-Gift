<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Light the candles and make a wish in this interactive birthday card.">
  <title>Happy birthday, Iftiqar Baloch!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff6e8;
      --muted: #e8d8d3;
      --gold: #ffd693;
      --rose: #f9bab0;
      --line: #f1caa43f;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      isolation: isolate;
      background: #100d1d;
      color: var(--ink);
      font: 1rem/1.55 var(--sans);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .sky img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #0c091a26, transparent 76%), linear-gradient(180deg, transparent 52%, #110a1d55 100%);
    }
    .starlight { position: absolute; inset: 0; z-index: 1; }
    .star {
      position: absolute;
      top: var(--y);
      left: var(--x);
      width: var(--size);
      aspect-ratio: 1;
      opacity: .55;
      border-radius: 50%;
      background: #ffebcc;
      box-shadow: 0 0 6px #ffdca477;
      animation: twinkle var(--period) var(--delay) ease-in-out infinite alternate;
    }
    .meteor {
      position: absolute;
      top: 16%;
      left: 76%;
      width: 96px;
      height: 1px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, #ffe3ac);
      box-shadow: 25px 0 24px #f9cb804a;
      transform: rotate(32deg);
      animation: shooting-star 13s 1.15s ease-out infinite;
    }
    .meteor.second { top: 8%; left: 21%; width: 68px; animation-delay: 7.3s; }
    @keyframes twinkle {
      from { opacity: .18; transform: scale(.78); }
      to { opacity: .87; transform: scale(1.12); }
    }
    @keyframes shooting-star {
      0%, 10% { opacity: 0; transform: translate(0, 0) rotate(32deg); }
      13% { opacity: .8; }
      19%, 100% { opacity: 0; transform: translate(190px, 120px) rotate(32deg); }
    }

    .wrap { width: min(calc(100% - 5rem), 74rem); margin-inline: auto; }
    .masthead {
      min-height: 4.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      border-bottom: 1px solid var(--line);
    }
    .titlemark { display: flex; align-items: center; gap: .7rem; font: 1.22rem/1.2 var(--serif); }
    .titlemark span { color: var(--gold); font: 1.25rem var(--sans); }
    .quiet, .primary {
      border: 1px solid var(--line);
      border-radius: 100px;
      min-height: 2.75rem;
      padding: .52rem 1.08rem;
      color: var(--ink);
      background: #17101e4f;
      font-weight: 650;
      font-size: .9rem;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .quiet:hover { background: #ffe7d418; }
    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      min-height: 3.35rem;
      border-color: #fff0c581;
      padding: .72rem 1.37rem;
      background: linear-gradient(125deg, #ffe4ab, #ffc195);
      color: #33211e;
      font-size: 1rem;
      box-shadow: 0 8px 35px #0b061957;
    }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px #ffbb7940; }
    .primary:active { transform: translateY(0); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.09fr) minmax(0, .91fr);
      grid-template-rows: 1fr auto auto 1fr;
      grid-template-areas: ". cake" "heading cake" "controls cake" ". cake";
      column-gap: clamp(2.65rem, 6vw, 6.1rem);
      padding-block: clamp(1.75rem, 6.3vh, 4.5rem) 3.75rem;
    }
    .headline { grid-area: heading; min-width: 0; animation: arrive .77s .07s both; }
    .dedication {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 0 0 1.55rem;
      color: var(--gold);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }
    .dedication::before { content: ""; width: 1.65rem; height: 1px; background: currentColor; flex: 0 0 auto; }
    h1 {
      margin: 0;
      font: 400 clamp(3.25rem, 6.1vw, 6rem)/.95 var(--serif);
      letter-spacing: -.067em;
      text-wrap: pretty;
    }
    h1 em { display: block; margin-top: .1em; color: var(--gold); font-weight: 400; overflow-wrap: anywhere; }
    .controls { grid-area: controls; margin-top: 1.8rem; animation: arrive .74s .21s both; }
    .description {
      color: var(--muted);
      margin: 0 0 1.42rem;
      max-width: 32ch;
      min-height: 3.1em;
      font-size: clamp(1rem, 1.27vw, 1.16rem);
      text-wrap: pretty;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .visual { grid-area: cake; position: relative; align-self: center; min-width: 0; animation: arrive .86s .13s both; }
    .photo-frame {
      position: relative;
      aspect-ratio: 1 / 1.12;
      overflow: hidden;
      border: 1px solid #ffdab076;
      border-radius: 1.25rem;
      background: #25131c;
      box-shadow: 0 27px 73px #09041088, 0 0 58px #e3917824;
      isolation: isolate;
      transition: box-shadow .7s ease;
    }
    [data-stage="lit"] .photo-frame { box-shadow: 0 27px 76px #0904108e, 0 0 80px #fdb17054; }
    .photo-frame::after {
      content: "";
      position: absolute;
      inset: .57rem;
      border: 1px solid #ffe3c445;
      border-radius: .86rem;
      pointer-events: none;
    }
    .photo-scene { position: absolute; inset: 50% 0 auto; transform: translateY(-50%); }
    .photo-scene img { display: block; width: 100%; height: auto; transition: filter .65s ease; }
    [data-stage="lit"] .photo-scene img { filter: brightness(1.13) saturate(1.07); }
    .photo-star { position: absolute; color: var(--gold); line-height: 1; text-shadow: 0 0 22px #fcb19799; }
    .photo-star.top { top: -1rem; right: -.88rem; font-size: 2.3rem; }
    .photo-star.bottom { bottom: 1.25rem; left: -.71rem; font-size: 1.3rem; }
    .wick { position: absolute; left: var(--x); top: 27.92%; }
    .glow, .flame, .smoke { position: absolute; left: 0; opacity: 0; pointer-events: none; }
    .glow {
      width: clamp(3.7rem, 8vw, 7.8rem);
      aspect-ratio: 1;
      top: -.65rem;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffbc57ad, #f98c2749 39%, transparent 72%);
      mix-blend-mode: screen;
      transition: opacity .48s ease;
    }
    .flame {
      width: clamp(.49rem, 1.03vw, .93rem);
      height: clamp(1.3rem, 2.55vw, 2.22rem);
      bottom: -.12rem;
      margin-left: calc(clamp(.49rem, 1.03vw, .93rem) / -2);
      border-radius: 90% 40% 58% 55% / 83% 83% 30% 31%;
      background: radial-gradient(ellipse at 53% 76%, #fffde4 15%, #fff2ae 40%, #ffc566 64%, #ff9e53 89%);
      box-shadow: 0 0 .55rem #ffbe79, 0 -.15rem .86rem .13rem #ff932f8c;
      transform-origin: 50% 90%;
      transition: opacity .19s ease;
    }
    [data-stage="lit"] .glow, [data-stage="lit"] .flame { opacity: 1; transition-delay: var(--delay); }
    [data-stage="lit"] .flame { animation: flicker .68s var(--delay) ease-in-out infinite alternate; }
    [data-stage="wished"] .flame { animation: extinguish .33s ease-out both; }
    .smoke {
      bottom: .15rem;
      left: -.3rem;
      width: 1rem;
      height: 2.1rem;
      border-radius: 70% 45% 61% 39%;
      background: radial-gradient(ellipse, #dcd1dc65, transparent 68%);
      filter: blur(2px);
    }
    [data-stage="wished"] .smoke { animation: smoke-rise 1.18s var(--delay) ease-out both; }
    @keyframes flicker {
      from { transform: rotate(-4deg) scale(.94, .94); }
      to { transform: rotate(4deg) scale(.91, 1.11); }
    }
    @keyframes extinguish {
      0% { opacity: 1; transform: rotate(0) scale(1); }
      60% { opacity: .45; transform: rotate(64deg) scale(.7); }
      100% { opacity: 0; transform: rotate(86deg) scale(.15); }
    }
    @keyframes smoke-rise {
      0% { opacity: 0; transform: translate(0, 0) scale(.4); }
      36% { opacity: .75; }
      100% { opacity: 0; transform: translate(18px, -49px) scale(1.5); }
    }

    dialog {
      width: min(35rem, calc(100% - 2rem));
      max-height: calc(100dvh - 2rem);
      padding: clamp(1.35rem, 5vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 1.15rem;
      color: var(--ink);
      background: #281b2d;
      box-shadow: 0 1.4rem 5rem #080512a6;
    }
    dialog::backdrop { background: #0e091bca; backdrop-filter: blur(7px); }
    .dialog-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; }
    h2 { margin: 0; font: 400 clamp(1.9rem, 5.4vw, 2.7rem)/1.09 var(--serif); letter-spacing: -.04em; }
    .close {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 auto;
      margin: -.35rem -.35rem .15rem 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: inherit;
      background: transparent;
      font-size: 1.55rem;
      line-height: 1;
    }
    .close:hover { background: #ffe7d418; }
    form { margin-top: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    label { display: block; margin: 0 0 .88rem; font-size: .94rem; font-weight: 640; }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: .32rem;
      padding: .61rem .7rem;
      border: 1px solid #fbcbb76b;
      border-radius: .55rem;
      color: var(--ink);
      background: #160f20;
      font-size: 1rem;
      font-weight: 400;
    }
    textarea { resize: vertical; min-height: 6rem; }
    input::placeholder { color: #d0b9ca; }
    .help, .download-status { margin: -.42rem 0 1rem; color: var(--muted); font-size: .9rem; }
    .download-status { margin: .7rem 0 0; }
    .download-status:empty { margin: 0; }
    .dialog-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }

    .letter { padding: 0; border: 0; background: transparent; box-shadow: none; color-scheme: light; }
    .letter-paper {
      position: relative;
      padding: clamp(1.45rem, 6vw, 3rem);
      border: 1px solid #eacaab;
      border-radius: 1.05rem;
      color: #3b2730;
      background: radial-gradient(ellipse at 24% 0%, #fff9e7, transparent 64%), #f6e5d2;
      box-shadow: inset 0 0 36px #a1615827;
    }
    .letter[open] .letter-paper { animation: unfold .8s .14s both; }
    .letter .seal, .envelope .seal {
      display: grid;
      place-items: center;
      width: 2.85rem;
      aspect-ratio: 1;
      margin: -.05rem 0 1.05rem;
      border-radius: 48% 45% 49% 42%;
      color: #ffe2b4;
      background: radial-gradient(circle at 37% 28%, #a9535a, #753044 74%);
      border: 1px solid #a45f59;
      box-shadow: inset 0 0 0 3px #ffa7782e, 0 4px 9px #54212b3d;
      font-size: 1.1rem;
    }
    .letter .close, .letter .quiet { color: #542c34; border-color: #9b606d88; background: transparent; }
    .letter .close:hover, .letter .quiet:hover { background: #8b324914; }
    .letter :focus-visible { outline-color: #963d54; }
    .letter h2, .letter .message, .letter .signature { overflow-wrap: anywhere; }
    .letter .message { margin-block: 1rem 1.2rem; white-space: pre-wrap; }
    .letter .signature { margin-block: 1rem 1.6rem; font: italic 1.3rem var(--serif); }
    .envelope {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12.2rem;
      height: 7.55rem;
      border-radius: .45rem;
      border: 1px solid #e3af86;
      background: linear-gradient(147deg, transparent 49.5%, #fff0d4 50%) left/51% 100% no-repeat,
        linear-gradient(213deg, transparent 49.5%, #f4d0ab 50%) right/51% 100% no-repeat, #dcb08b;
      box-shadow: 0 15px 30px #1b101650;
      opacity: 0;
      pointer-events: none;
    }
    .flap {
      position: absolute;
      inset: 0 0 auto;
      height: 62%;
      transform-origin: center top;
      clip-path: polygon(0 0, 100% 0, 50% 96%);
      background: linear-gradient(#fff2d6, #e4b089);
    }
    .envelope .seal { position: absolute; top: 43%; left: 50%; width: 2.36rem; transform: translateX(-50%); }
    .letter[open] .envelope { animation: send-open .85s both; }
    .letter[open] .flap { animation: open-flap .53s .18s both; }
    .letter[open] .envelope .seal { animation: unseal .35s .18s both; }
    @keyframes unfold {
      0% { opacity: 0; transform: translateY(27px) scale(.94); }
      41% { opacity: 0; }
      100% { opacity: 1; transform: none; }
    }
    @keyframes send-open {
      0% { opacity: 0; transform: translate(-50%, -35%) scale(.87); }
      24%, 61% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -14%) scale(.87); visibility: hidden; }
    }
    @keyframes open-flap { 0% { transform: perspective(260px) rotateX(0); } 100% { transform: perspective(260px) rotateX(161deg); } }
    @keyframes unseal { from { opacity: 1; } to { opacity: 0; transform: translate(-40%, 16px) rotate(14deg); } }



    .dance-stage { max-width:600px; height:320px; margin:1.5rem auto 0; overflow:hidden; border:1px solid var(--line); border-radius:1rem; background:radial-gradient(ellipse at bottom, #9a6086, #201629 72%); }
    .dance-stage img { display:block; height:285px; max-width:85%; width:auto; margin:10px auto 0; border-radius:1rem; transform-origin:50% 95%; animation:dance-arrival .8s ease-out, dance-step .65s .8s ease-in-out infinite alternate; }
    @keyframes dance-arrival { from { transform:translateX(-160px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    @keyframes dance-step { 0% { transform:rotate(-8deg) translateY(0); } 50% { transform:rotate(0deg) translateY(-10px); } 100% { transform:rotate(8deg) translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .dance-stage img { animation:none; } }
    .surprises { position: relative; padding: 0 0 5rem; text-align: center; }
    .surprises h2 { margin-bottom: .6rem; }
    .surprises p { color: var(--muted); margin: 0 0 1.2rem; }
    .surprise-buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:.7rem; }
    .surprise-buttons button { background:#23182fd9; }
    .balloon-stage { position:relative; overflow:hidden; height:240px; max-width:600px; margin:1.5rem auto 0; border:1px solid var(--line); border-radius:1rem; background:#201629d9; }
    .boy { position:absolute; left:14%; bottom:12px; width:110px; height:175px; animation:enter-boy .7s ease-out both; }
    .boy-head { position:absolute; width:72px; height:77px; top:8px; left:18px; background:#d99668; border-radius:46% 48% 45% 48%; border-top:17px solid #271c25; }
    .boy-head:before { content:""; position:absolute; width:7px; height:7px; border-radius:50%; background:#251927; left:49px; top:22px; }
    .boy-head:after { content:""; position:absolute; width:9px; height:9px; border:2px solid #713b38; border-radius:50%; right:-3px; top:38px; animation:puff .5s infinite alternate; }
    .boy-body { position:absolute; top:81px; left:14px; width:78px; height:82px; background:#65a8c5; border-radius:30px 30px 8px 8px; }
    .boy-body:after { content:""; position:absolute; width:58px; height:13px; background:#d99668; top:20px; left:53px; border-radius:20px; transform:rotate(-15deg); }
    .air { position:absolute; top:51px; left:95px; color:#fff4d6; font-size:1.2rem; animation:air .7s infinite; }
    .balloon { position:absolute; bottom:80px; left:var(--x); width:48px; height:60px; border-radius:50% 50% 48% 48%; background:var(--color); box-shadow:inset -7px -8px 0 #0002, inset 8px 5px 0 #fff5; transform-origin:bottom; animation:inflate 1.8s var(--delay) both, float 3s calc(var(--delay) + 1.8s) ease-in-out infinite alternate; }
    .balloon:after { content:""; position:absolute; top:58px; left:50%; width:1px; height:62px; background:#fff9; transform:rotate(7deg); transform-origin:top; }
    @keyframes enter-boy { from { transform:translateX(-180px); } to { transform:translateX(0); } }
    @keyframes puff { to { transform:scale(1.4); } }
    @keyframes air { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(30px); } }
    @keyframes inflate { from { transform:scale(.05); opacity:0; } 15% { opacity:1; } to { transform:scale(1); opacity:1; } }
    @keyframes float { from { transform:translateY(0) rotate(-4deg); } to { transform:translateY(-18px) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .boy, .balloon { animation:none; } .air { display:none; } }
    #celebration { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    noscript p { color: var(--muted); }
    @media (max-width: 820px) {
      .wrap { width: calc(100% - 2.5rem); }
      .masthead { min-height: 3.86rem; }
      .hero {
        max-width: 29rem;
        grid-template: "heading" auto "cake" auto "controls" auto / minmax(0, 1fr);
        row-gap: 1.02rem;
        padding-block: 1.35rem 2.25rem;
        text-align: center;
      }
      .sky img { object-position: 35% bottom; }
      .sky::after { background: linear-gradient(180deg, #0d09192c, transparent 50%, #100b1cbd); }
      .dedication { justify-content: center; margin-bottom: .8rem; font-size: .72rem; }
      .dedication::before { display: none; }
      h1 { font-size: clamp(2.9rem, 9.9vw, 4.6rem); }
      .photo-frame { aspect-ratio: unset; height: min(77vw, 38svh, 22.5rem); }
      .photo-star.top { right: -.5rem; top: -.7rem; font-size: 1.55rem; }
      .photo-star.bottom { left: -.4rem; font-size: 1.05rem; }
      .controls { margin-top: 0; }
      .description { margin: .15rem auto .85rem; min-height: 0; }
    }
    @media (max-width: 390px) {
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; animation-delay: 0s !important; transition-delay: 0s !important; }
      .star { animation: none; }
      .meteor, .envelope { display: none; }
    }
  </style>
</head>

  <canvas id="celebration" aria-hidden="true" hidden></canvas>
  <script type="application/json" id="gift-data">
    {"recipient":"Iftiqar Baloch","sender":"Asim","place":"Panjgur, Balochistan","message":"I’m glad I get to call you my friend. I wanted to make you something you could keep, so I put a little piece of Panjgur under this birthday sky.\n\nI hope this year brings you good news you can’t wait to share and a few stories that get funnier every time you tell them. Have a great birthday, Iftiqar."}
  </script>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const defaultGift = JSON.parse($("#gift-data").textContent);
    const hero = $(".hero");
    const celebrate = $("#celebrate");
    const letter = $("#letter");
    const editor = $("#editor");
    const storageKey = "birthday-build-draft-v2:" + defaultGift.recipient;
    const exportTemplate = editor ? document.documentElement.cloneNode(true) : null;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    const stages = {
      unlit: { action: "Light the candles" },
      lit: { description: "Think of a wish. Tap when you’re ready to blow out the candles.", action: "Make a wish" },
      wished: { description: "May it come true. I wrote you a letter, too.", action: "Open your letter" }
    };

    let gift = defaultGift;
    if (editor) {
      try {
        const draft = JSON.parse(localStorage.getItem(storageKey));
        if (draft && Object.keys(defaultGift).every((key) => typeof draft[key] === "string")) {
          gift = draft;
        }
      } catch {
        // The card also works when the browser disables local storage.
      }
    }

    function addStars() {
      const sky = $("#starlight");
      const stars = document.createDocumentFragment();
      for (let i = 0; i < 48; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.setProperty("--x", ((i * 37.79 + 6) % 99).toFixed(1) + "%");
        star.style.setProperty("--y", ((i * 21.37 + 3) % 77).toFixed(1) + "%");
        star.style.setProperty("--size", (1 + (i % 6) / 3).toFixed(1) + "px");
        star.style.setProperty("--period", (3.2 + (i % 8) * .46).toFixed(1) + "s");
        star.style.setProperty("--delay", (-i * .29).toFixed(2) + "s");
        stars.append(star);
      }
      sky.append(stars);
    }

    function renderGift() {
      document.title = "Happy birthday, " + gift.recipient + "!";
      $("#recipient").textContent = gift.recipient + "!";
      $("#place").textContent = gift.place;
      $("#dedication").hidden = !gift.place;
      $("#letter-heading").textContent = "Dear " + gift.recipient.split(/\s+/)[0] + ",";
      $("#letter-text").textContent = gift.message;
      $("#signature").textContent = "— " + gift.sender;
    }

    function showStage(stage) {
      hero.dataset.stage = stage;
      $("#stage-text").textContent = stages[stage].description || "A little birthday surprise from " + gift.sender + ".";
      $("#action-text").textContent = stages[stage].action;
      $("#action-icon").textContent = stage === "wished" ? "✉︎" : "✦";
      if (stage === "wished") {
        celebrate.setAttribute("aria-haspopup", "dialog");
      } else {
        celebrate.removeAttribute("aria-haspopup");
      }
    }

    celebrate.addEventListener("click", () => {
      switch (hero.dataset.stage) {
        case "unlit":
          showStage("lit");
          break;
        case "lit":
          showStage("wished");
          launchFireworks();
          break;
        case "wished":
          letter.showModal();
          break;
      }
    });

    $("#replay").addEventListener("click", () => {
      letter.close();
      stopFireworks();
      showStage("unlit");
      celebrate.focus();
    });

    for (const close of document.querySelectorAll("[data-close]")) {
      close.addEventListener("click", () => close.closest("dialog").close());
    }

    if (editor) {
      const form = $("#gift-form");
      const status = $("#download-status");

      $("#personalize").addEventListener("click", () => {
        for (const key of Object.keys(defaultGift)) {
          form.elements.namedItem(key).value = gift[key];
        }
        status.textContent = "";
        editor.showModal();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const fields = new FormData(form);
        gift = {
          recipient: fields.get("recipient").trim() || defaultGift.recipient,
          sender: fields.get("sender").trim() || defaultGift.sender,
          place: fields.get("place").trim(),
          message: fields.get("message").trim() || defaultGift.message
        };

        try {
          localStorage.setItem(storageKey, JSON.stringify(gift));
        } catch {
          // Saving a draft is optional.
        }

        stopFireworks();
        renderGift();
        showStage("unlit");
        if (event.submitter?.value === "download") {
          downloadGift();
          status.textContent = "Gift downloaded. Open the file to check it before sending.";
        } else {
          editor.close();
        }
      });
    }

    function downloadGift() {
      const page = exportTemplate.cloneNode(true);
      page.querySelectorAll("[data-editor]").forEach((element) => element.remove());
      page.querySelector("#gift-data").textContent = JSON.stringify(gift).replace(/</g, "\\u003c");
      const file = new Blob(["<!doctype html>\n", page.outerHTML], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      const slug = gift.recipient.replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "");
      const url = URL.createObjectURL(file);
      link.href = url;
      link.download = (slug || "Birthday") + "-Birthday.html";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    const canvas = $("#celebration");
    let frame = 0;

    function stopFireworks() {
      cancelAnimationFrame(frame);
      canvas.hidden = true;
    }

    function launchFireworks() {
      if (reducedMotion.matches) return;
      const draw = canvas.getContext("2d");
      if (!draw) return;

      stopFireworks();
      const width = window.innerWidth;
      const height = window.innerHeight;
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      canvas.hidden = false;
      draw.scale(scale, scale);

      const velocity = Math.min(245, width * .43);
      const bursts = [
        { x: width * .27, y: height * .28, at: .27, palette: ["#ffda8f", "#fff3c9", "#ffad78"] },
        { x: width * .75, y: height * .22, at: .68, palette: ["#f99fb8", "#ffe7d8", "#ffc584"] },
        { x: width * .53, y: height * .40, at: 1.08, palette: ["#c2c6ff", "#fff2ce", "#f8acc9"] }
      ];
      const sparks = bursts.flatMap((burst) => Array.from({ length: 44 }, (_, i) => {
        const angle = 2 * Math.PI * i / 44 + Math.random() * .17;
        const speed = velocity * (.34 + Math.random() * .66);
        return {
          ...burst,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: burst.palette[i % burst.palette.length],
          life: .92 + Math.random() * .66
        };
      }));
      const confettiColors = ["#f4c781", "#ffdcb5", "#f591ba", "#d0baff", "#fff2db"];
      const confetti = Array.from({ length: width < 600 ? 54 : 87 }, (_, i) => ({
        x: Math.random() * width,
        y: -6 - Math.random() * height * .36,
        speed: 86 + Math.random() * 165,
        drift: (Math.random() - .5) * 63,
        spin: (Math.random() - .5) * 8,
        size: 3 + Math.random() * 5,
        color: confettiColors[i % confettiColors.length]
      }));
      const started = performance.now();

      function tick(now) {
        const time = (now - started) / 1000;
        draw.clearRect(0, 0, width, height);
        if (time >= 3.6) {
          stopFireworks();
          return;
        }

        draw.lineWidth = 1.55;
        draw.lineCap = "round";
        for (const spark of sparks) {
          const age = time - spark.at;
          if (age < 0 || age >= spark.life) continue;
          const distance = age * (1 - .29 * age / spark.life);
          const x = spark.x + spark.vx * distance;
          const y = spark.y + spark.vy * distance + 49 * age ** 2;
          draw.globalAlpha = (1 - age / spark.life) ** .75;
          draw.strokeStyle = spark.color;
          draw.beginPath();
          draw.moveTo(x - spark.vx * .038, y - (spark.vy + 98 * age) * .038);
          draw.lineTo(x, y);
          draw.stroke();
        }

        const fall = Math.max(0, time - .38);
        draw.globalAlpha = Math.min(1, fall * 3, (3.6 - time) * .83);
        for (const piece of confetti) {
          draw.save();
          draw.translate(piece.x + piece.drift * fall, piece.y + piece.speed * fall);
          draw.rotate(piece.spin * fall);
          draw.fillStyle = piece.color;
          draw.fillRect(0, 0, piece.size, piece.size * 1.42);
          draw.restore();
        }

        frame = requestAnimationFrame(tick);
      }

      frame = requestAnimationFrame(tick);
    }



    let birthdayAudio = null;
    let birthdayTimer = null;
    const danceButton = $("#dance-button");
    const danceStage = $("#dance-stage");
    const birthdayNotes = [
      [392,.36],[392,.18],[440,.54],[392,.54],[523.25,.54],[493.88,1.05],
      [392,.36],[392,.18],[440,.54],[392,.54],[587.33,.54],[523.25,1.05],
      [392,.36],[392,.18],[783.99,.54],[659.25,.54],[523.25,.54],[493.88,.54],[440,1.05],
      [698.46,.36],[698.46,.18],[659.25,.54],[523.25,.54],[587.33,.54],[523.25,1.25]
    ];

    function stopDance() {
      if (birthdayTimer) clearTimeout(birthdayTimer);
      birthdayTimer = null;
      if (birthdayAudio) birthdayAudio.close();
      birthdayAudio = null;
      danceStage.hidden = true;
      danceButton.setAttribute("aria-pressed", "false");
      danceButton.textContent = "🎵 Dance and music";
    }

    danceButton.addEventListener("click", async () => {
      if (birthdayAudio) { stopDance(); return; }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        danceStage.hidden = false;
        danceButton.textContent = "Music unavailable on this browser";
        return;
      }
      const context = new AudioContextClass();
      birthdayAudio = context;
      try { await context.resume(); } catch { stopDance(); return; }
      if (birthdayAudio !== context) return;
      danceStage.hidden = false;
      danceButton.setAttribute("aria-pressed", "true");
      danceButton.textContent = "■ Stop dance and music";
      let at = context.currentTime + .05;
      for (const [frequency, duration] of birthdayNotes) {
        const oscillator = context.createOscillator();
        const volume = context.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.value = frequency;
        volume.gain.setValueAtTime(.0001, at);
        volume.gain.exponentialRampToValueAtTime(.13, at + .025);
        volume.gain.exponentialRampToValueAtTime(.0001, at + duration * .9);
        oscillator.connect(volume);
        volume.connect(context.destination);
        oscillator.start(at);
        oscillator.stop(at + duration);
        at += duration;
      }
      birthdayTimer = setTimeout(stopDance, (at - context.currentTime + .2) * 1000);
    });

    $("#balloon-button").addEventListener("click", () => {
      const stage = $("#balloon-stage");
      stage.hidden = false;
      stage.querySelectorAll(".boy, .balloon").forEach((item) => {
        item.style.animation = "none";
        void item.offsetWidth;
        item.style.animation = "";
      });
    });
    $("#fireworks-button").addEventListener("click", launchFireworks);
    $("#letter-button").addEventListener("click", () => letter.showModal());

    addStars();
    renderGift();
    showStage("unlit");
  </script>
</body>
</html>
